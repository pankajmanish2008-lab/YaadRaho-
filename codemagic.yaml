workflows:
  yaad_raho_android:
    name: YaadRaho Android APK
    instance_type: linux_x2
    environment:
      flutter: stable
      groups:
        - google_play
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
